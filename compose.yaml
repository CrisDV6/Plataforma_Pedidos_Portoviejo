
services:
  inventario:
    build: ./Inventario
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      RETARDO_MS: "1000"

  pedidos:
    build: ./Pedidos
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      INVENTARIO_URL: "http://inventario:3001"
      TIMEOUT: "2000"
    depends_on:
      - inventario
